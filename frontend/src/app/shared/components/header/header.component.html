<header class="bg-white border-bottom px-4 py-3">
  <div class="d-flex justify-content-between align-items-center">
    <!-- Título da página -->
    <h5 class="mb-0">{{ getPageTitle() }}</h5>

    <!-- Informações do usuário -->
    <div class="user-menu" *ngIf="currentUser$ | async as user">
      <div class="user-info" (click)="toggleDropdown()">
        <span class="badge me-2" [ngClass]="getRoleBadgeClass(user.role)">
          {{ getRoleLabel(user.role) }}
        </span>
        <span class="user-name">{{ user.name }}</span>
        <i class="bi bi-chevron-down ms-2"></i>
      </div>

      <!-- Dropdown menu -->
      <div class="dropdown-menu" [class.show]="showDropdown">
        <div class="dropdown-header">
          <strong>{{ user.name }}</strong>
          <small class="d-block text-muted">{{ user.email }}</small>
          <small class="d-block text-muted" *ngIf="user.tenant">
            <i class="bi bi-building me-1"></i>{{ user.tenant.name }}
          </small>
        </div>
        <div class="dropdown-divider"></div>
        <a class="dropdown-item" href="#" (click)="$event.preventDefault()">
          <i class="bi bi-person me-2"></i>
          Meu Perfil
        </a>
        <a class="dropdown-item" href="#" (click)="$event.preventDefault()">
          <i class="bi bi-gear me-2"></i>
          Configurações
        </a>
        <div class="dropdown-divider"></div>
        <a class="dropdown-item text-danger" href="#" (click)="$event.preventDefault(); logout()">
          <i class="bi bi-box-arrow-right me-2"></i>
          Sair
        </a>
      </div>
    </div>
  </div>

  <!-- Overlay para fechar dropdown ao clicar fora -->
  <div class="dropdown-overlay" *ngIf="showDropdown" (click)="toggleDropdown()"></div>
</header>
