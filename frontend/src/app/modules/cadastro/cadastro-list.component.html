<!-- Content Header (Page header) -->
<div class="content-header">
  <div class="container-fluid">
    <div class="row mb-2">
      <div class="col-sm-12">
        <h1 class="m-0"><i class="fas fa-folder-plus mr-2"></i>Cadastros</h1>
      </div>
    </div>
  </div>
</div>

<!-- Main content -->
<section class="content">
  <div class="container-fluid">
    <div class="row">
      <div class="col-12">
        <div class="card">
          <div class="card-header">
            <h3 class="card-title"><i class="fas fa-list mr-2"></i>Selecione o tipo de cadastro que deseja gerenciar</h3>
          </div>
          <div class="card-body">
            <div class="row">
              <div class="col-lg-3 col-md-6 col-sm-12" *ngFor="let option of cadastroOptions">
                <div class="info-box mb-3 cadastro-card" (click)="navigateTo(option.route)" [ngClass]="option.cardClass">
                  <span class="info-box-icon elevation-1" [ngClass]="option.iconBgClass">
                    <i [class]="option.icon"></i>
                  </span>
                  <div class="info-box-content">
                    <span class="info-box-text">{{ option.title }}</span>
                    <span class="info-box-number">
                      {{ option.description }}
                      <i class="fas fa-arrow-circle-right ml-2"></i>
                    </span>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
