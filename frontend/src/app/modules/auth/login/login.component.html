<div class="login-page">
  <div class="login-box">
    <!-- Logo -->
    <div class="login-logo">
      <a href="#"><b>Fornecedor</b>Air</a>
    </div>
    <!-- /.login-logo -->

    <div class="card">
      <div class="card-body login-card-body">
        <p class="login-box-msg">Entre com suas credenciais</p>

        <!-- Alert de erro -->
        <div class="alert alert-danger alert-dismissible" *ngIf="error" role="alert">
          <button type="button" class="close" data-dismiss="alert" aria-hidden="true" (click)="error = ''">×</button>
          <i class="icon fas fa-ban"></i> {{ error }}
        </div>

        <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
          <!-- Email -->
          <div class="input-group mb-3">
            <input
              type="email"
              class="form-control"
              placeholder="Email"
              formControlName="email"
              [class.is-invalid]="f['email'].invalid && f['email'].touched">
            <div class="input-group-append">
              <div class="input-group-text">
                <span class="fas fa-envelope"></span>
              </div>
            </div>
            <div class="invalid-feedback" *ngIf="f['email'].invalid && f['email'].touched">
              <span *ngIf="f['email'].errors?.['required']">Email é obrigatório</span>
              <span *ngIf="f['email'].errors?.['email']">Email inválido</span>
            </div>
          </div>

          <!-- Senha -->
          <div class="input-group mb-3">
            <input
              type="password"
              class="form-control"
              placeholder="Senha"
              formControlName="password"
              [class.is-invalid]="f['password'].invalid && f['password'].touched">
            <div class="input-group-append">
              <div class="input-group-text">
                <span class="fas fa-lock"></span>
              </div>
            </div>
            <div class="invalid-feedback" *ngIf="f['password'].invalid && f['password'].touched">
              <span *ngIf="f['password'].errors?.['required']">Senha é obrigatória</span>
              <span *ngIf="f['password'].errors?.['minlength']">Senha deve ter no mínimo 6 caracteres</span>
            </div>
          </div>

          <!-- Botões -->
          <div class="row">
            <div class="col-8">
              <div class="icheck-primary">
                <input type="checkbox" id="remember">
                <label for="remember">
                  Lembrar-me
                </label>
              </div>
            </div>
            <div class="col-4">
              <button type="submit" class="btn btn-primary btn-block" [disabled]="loading || loginForm.invalid">
                <span *ngIf="!loading">Entrar</span>
                <span *ngIf="loading">
                  <i class="fas fa-spinner fa-spin"></i>
                </span>
              </button>
            </div>
          </div>
        </form>

        <p class="mb-1 mt-3">
          <a href="#">Esqueci minha senha</a>
        </p>
      </div>
      <!-- /.login-card-body -->

      <!-- Credenciais de teste -->
      <div class="card-footer bg-light">
        <p class="mb-1 text-center"><small><strong>Credenciais de Teste</strong></small></p>
        <div class="text-center small">
          <div><strong>Admin:</strong> admin@alpha.com</div>
          <div><strong>Atendente:</strong> attendant@alpha.com</div>
          <div><strong>Gerente:</strong> sales_manager@alpha.com</div>
          <div class="mt-1"><em>Senha: password123</em></div>
        </div>
      </div>
    </div>
  </div>
</div>
