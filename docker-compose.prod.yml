version: '3.8'

services:
  postgres:
    image: postgres:14-alpine
    container_name: fornecedorair-db
    environment:
      POSTGRES_DB: ${DATABASE_NAME:-fornecedorair}
      POSTGRES_USER: ${DATABASE_USER:-postgres}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-postgres}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - fornecedorair-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: fornecedorair-backend
    environment:
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_NAME: ${DATABASE_NAME:-fornecedorair}
      DATABASE_USER: ${DATABASE_USER:-postgres}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:-postgres}
      WHATSAPP_SERVICE_URL: http://whatsapp:3001
      OLLAMA_API_URL: ${OLLAMA_API_URL:-http://host.docker.internal:11434}
      JWT_SECRET: ${JWT_SECRET:-change-this-in-production}
      PORT: 3000
      NODE_ENV: production
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - fornecedorair-network
    restart: unless-stopped

  whatsapp:
    build:
      context: ./services/whatsapp
      dockerfile: Dockerfile
    container_name: fornecedorair-whatsapp
    environment:
      PORT: 3001
      BACKEND_WEBHOOK_URL: http://backend:3000/api/v1/webhooks/whatsapp
      NODE_ENV: production
    ports:
      - "3001:3001"
    volumes:
      - whatsapp_session:/app/.wwebjs_auth
      - whatsapp_cache:/app/.wwebjs_cache
    networks:
      - fornecedorair-network
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: fornecedorair-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - fornecedorair-network
    restart: unless-stopped

volumes:
  postgres_data:
  whatsapp_session:
  whatsapp_cache:

networks:
  fornecedorair-network:
    driver: bridge
