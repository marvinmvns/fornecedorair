version: '3.8'

services:
  postgres:
    image: postgres:14-alpine
    container_name: fornecedorair-db
    environment:
      POSTGRES_DB: fornecedorair
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - fornecedorair-network

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: fornecedorair-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@fornecedorair.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - postgres
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    networks:
      - fornecedorair-network

  # Ollama (opcional - requer GPU para melhor performance)
  # Descomente se quiser rodar Ollama em container
  # ollama:
  #   image: ollama/ollama:latest
  #   container_name: fornecedorair-ollama
  #   ports:
  #     - "11434:11434"
  #   volumes:
  #     - ollama_data:/root/.ollama
  #   networks:
  #     - fornecedorair-network
  #   # Descomente se tiver GPU NVIDIA
  #   # deploy:
  #   #   resources:
  #   #     reservations:
  #   #       devices:
  #   #         - driver: nvidia
  #   #           count: 1
  #   #           capabilities: [gpu]

  # Redis (opcional - para cache futuro)
  # redis:
  #   image: redis:7-alpine
  #   container_name: fornecedorair-redis
  #   ports:
  #     - "6379:6379"
  #   volumes:
  #     - redis_data:/data
  #   networks:
  #     - fornecedorair-network

volumes:
  postgres_data:
  pgadmin_data:
  # ollama_data:
  # redis_data:

networks:
  fornecedorair-network:
    driver: bridge
